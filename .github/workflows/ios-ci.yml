name: ios-ci

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ios-ci.yml'
      - 'android/build.gradle.kts'
      - 'android/gradle/**'
      - 'android/gradle.properties'
      - 'android/gradlew'
      - 'android/gradlew.bat'
      - 'android/iosApp/**'
      - 'android/settings.gradle.kts'
      - 'android/shared/**'

concurrency:
  group: ios-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-verification:
    name: iOS PR verification
    runs-on: macos-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
          cache-read-only: false

      - name: Cache Kotlin Native
        uses: actions/cache@v5
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('android/iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Read Xcode version
        id: xcode-version
        run: |
          set -euo pipefail

          version="$(xcodebuild -version | tr '\n ' '__')"
          echo "value=${version%_}" >> "$GITHUB_OUTPUT"

      - name: Cache Xcode DerivedData
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/DerivedData
          key: ${{ runner.os }}-${{ runner.arch }}-derived-data-${{ steps.xcode-version.outputs.value }}-${{ hashFiles('android/iosApp/iosApp.xcodeproj/project.pbxproj', 'android/iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'android/gradle/libs.versions.toml') }}-${{ hashFiles('android/iosApp/iosApp/**', 'android/shared/src/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-derived-data-${{ steps.xcode-version.outputs.value }}-${{ hashFiles('android/iosApp/iosApp.xcodeproj/project.pbxproj', 'android/iosApp/iosApp.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'android/gradle/libs.versions.toml') }}-

      - name: Create non-sensitive iOS configuration
        run: |
          set -euo pipefail

          printf '%s\n' \
            'BASE_URL=https://ci.example.invalid/' \
            'TEST_BASE_URL=https://ci.example.invalid/' \
            > local.properties

          create_google_service_info() {
            local bundle_id="$1"
            local app_id="$2"
            local output_path="$3"

            mkdir -p "$(dirname "$output_path")"
            plutil -create xml1 "$output_path"
            plutil -insert API_KEY -string ci-placeholder-not-a-real-api-key "$output_path"
            plutil -insert GCM_SENDER_ID -string 000000000000 "$output_path"
            plutil -insert PLIST_VERSION -string 1 "$output_path"
            plutil -insert BUNDLE_ID -string "$bundle_id" "$output_path"
            plutil -insert PROJECT_ID -string yeobaek-ci "$output_path"
            plutil -insert STORAGE_BUCKET -string yeobaek-ci.invalid "$output_path"
            plutil -insert IS_ADS_ENABLED -bool false "$output_path"
            plutil -insert IS_ANALYTICS_ENABLED -bool false "$output_path"
            plutil -insert IS_APPINVITE_ENABLED -bool false "$output_path"
            plutil -insert IS_GCM_ENABLED -bool true "$output_path"
            plutil -insert IS_SIGNIN_ENABLED -bool true "$output_path"
            plutil -insert GOOGLE_APP_ID -string "$app_id" "$output_path"
          }

          create_google_service_info \
            com.yeobaek.haro.debug \
            1:000000000000:ios:0000000000000000 \
            iosApp/Configuration/firebase/debug/GoogleService-Info.plist
          create_google_service_info \
            com.yeobaek.haro \
            1:000000000000:ios:0000000000000001 \
            iosApp/Configuration/firebase/release/GoogleService-Info.plist

      - name: Compile iOS test sources
        run: ./gradlew :shared:compileTestKotlinIosSimulatorArm64 --stacktrace --console=plain

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -scheme iosApp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -resultBundlePath "$RUNNER_TEMP/ios-build.xcresult" \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            DEBUG_INFORMATION_FORMAT=dwarf \
            ENABLE_PREVIEWS=NO \
            SKIP_CRASHLYTICS_UPLOAD=1 \
            SWIFT_EMIT_LOC_STRINGS=NO \
            build

      - name: Upload iOS verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-ci-reports
          path: |
            android/shared/build/reports/**
            android/shared/build/test-results/**
            ${{ runner.temp }}/ios-build.xcresult
          if-no-files-found: ignore
          retention-days: 14
