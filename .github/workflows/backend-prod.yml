# 백엔드 CI/CD (M8 배포 구성 결정, 2026-08-06)
# main에 서버 빌드·실행 관련 변경이 푸시되면: 게이트(테스트+정적분석) → 도커 이미지 빌드 → Docker Hub 푸시(빌드 잡)
# → EC2의 셀프 호스티드 러너에서 블루·그린 전환(배포 잡). 보안 그룹이 SSH를 막고 있어
# SSH 대신 EC2에 상주하는 러너(라벨: ec2-prod)가 배포를 수행한다. 시크릿은 backend/docs/배포_가이드.md 참고.
name: backend-prod

on:
  push:
    branches: [main]
    paths:
      # 서버 코드·리소스와 빌드/런타임·정적 분석 설정을 감지한다.
      # 테스트 변경은 배포물에 영향이 없으므로 제외한다 (스펙은 springdoc이 런타임 생성).
      - 'backend/src/main/**'
      - 'backend/build.gradle*'
      - 'backend/settings.gradle*'
      - 'backend/gradle.properties'
      - 'backend/gradle/**'
      - 'backend/gradlew'
      - 'backend/config/**'
      - 'backend/infra/prod/Dockerfile'
      - 'backend/infra/prod/docker-compose.prod.yml'
      - 'backend/infra/deploy/deploy.sh'
      - 'backend/infra/deploy/deploy_support.py'
      - '.github/workflows/backend-prod.yml'
  workflow_dispatch:

# 연속 푸시 시 배포가 겹치지 않도록 직렬화한다 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: backend-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    # 수동 실행도 main 브랜치에서만 허용한다.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment scripts
        run: |
          bash -n infra/deploy/deploy.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s infra/deploy/tests -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 커밋 전 게이트와 동일한 검증 (테스트는 Testcontainers로 MySQL 컨테이너 사용)
      - name: Build (tests + PMD + SpotBugs)
        run: ./gradlew build

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # EC2가 Graviton(arm64)이라 멀티아키로 빌드한다. amd64 단일 빌드는 exec format error로 기동 불가.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (amd64+arm64)
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/infra/prod/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            DEPLOYED_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/yeobaek-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/yeobaek-backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, ec2-prod]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # 서버에 준비한 Compose와 .env를 사용한다.
      - name: Deploy production server (blue/green)
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/yeobaek-backend:${{ github.sha }}
          DEPLOYED_COMMIT_SHA: ${{ github.sha }}
          COMPOSE_PROJECT_NAME: yeobaek
          NGINX_CONFIG: /etc/nginx/conf.d/yeobaek.conf
          HEALTH_URL: https://yeobaek.duckdns.org/health
          DEPLOY_LABEL: 운영
        run: |
          set -euo pipefail
          export DEPLOY_DIR="$HOME/yeobaek"
          bash "$GITHUB_WORKSPACE/backend/infra/deploy/deploy.sh" "$DEPLOY_IMAGE" "$DEPLOYED_COMMIT_SHA"
