# develop: 테스트·정적 분석 → 이미지 발행 → 개발 서버 배포.
# 사전 준비: 개발 서버에 ec2-dev 러너와 ~/yeobaek-dev/docker-compose.yml, .env를 설정한다.
# Compose의 app 서비스와 DB·볼륨·컨테이너 이름은 개발 전용으로 구성한다.
name: backend-dev

on:
  push:
    branches: [develop]
    paths:
      # 서버 코드·빌드 설정 변경에 배포한다. 테스트만의 변경은 PR CI에서 검증한다.
      - 'backend/src/main/**'
      - 'backend/build.gradle*'
      - 'backend/settings.gradle*'
      - 'backend/gradle.properties'
      - 'backend/gradle/**'
      - 'backend/gradlew'
      - 'backend/config/**'
      - 'backend/infra/prod/Dockerfile'
      - '.github/workflows/backend-dev.yml'
  workflow_dispatch:
concurrency:
  group: backend-dev-develop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-push:
    # 수동 실행도 develop 브랜치에서만 허용한다.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build (tests + PMD + SpotBugs)
        run: ./gradlew build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push develop image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/infra/prod/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/yeobaek-backend:develop
            ${{ secrets.DOCKERHUB_USERNAME }}/yeobaek-backend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, ec2-dev]
    steps:
      # 개발 서버에 준비한 Compose를 사용한다. 운영 배포 디렉터리와 분리한다.
      - name: Pull & restart development server
        env:
          DEPLOY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/yeobaek-backend:${{ github.sha }}
        run: |
          set -euo pipefail
          cd ~/yeobaek-dev
          test -f docker-compose.yml
          test -f .env

          # 가변 develop 태그 대신 이 실행에서 빌드한 커밋의 이미지를 지정한다.
          override_file=$(mktemp ./deploy-image.XXXXXX)
          trap 'rm -f "$override_file"' EXIT
          printf 'services:\n  app:\n    image: "%s"\n' "$DEPLOY_IMAGE" > "$override_file"

          docker compose -p yeobaek-dev -f docker-compose.yml -f "$override_file" pull app
          docker compose -p yeobaek-dev -f docker-compose.yml -f "$override_file" up -d
          docker image prune -f
