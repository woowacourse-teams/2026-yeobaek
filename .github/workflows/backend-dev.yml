# develop: 테스트·정적 분석 → 이미지 발행 → 개발 서버 배포.
# 사전 준비: 개발 서버에 ec2-dev 러너와 ~/yeobaek-dev/docker-compose.yml, .env를 설정한다.
# Compose의 app-blue/app-green 서비스와 DB·볼륨·컨테이너 이름은 개발 전용으로 구성한다.
name: backend-dev

on:
  push:
    branches: [develop]
    paths:
      # 배포에 사용하는 서버 코드·빌드 설정·배포 스크립트 변경에 실행한다.
      - 'backend/src/main/**'
      - 'backend/build.gradle*'
      - 'backend/settings.gradle*'
      - 'backend/gradle.properties'
      - 'backend/gradle/**'
      - 'backend/gradlew'
      - 'backend/config/**'
      - 'backend/infra/prod/Dockerfile'
      - 'backend/infra/dev/docker-compose.dev.yml'
      - 'backend/infra/dev/deploy.sh'
      - 'backend/infra/dev/deploy_support.py'
      - 'backend/infra/monitoring/measure.py'
      - '.github/workflows/backend-dev.yml'
  workflow_dispatch:
concurrency:
  group: backend-dev-develop
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  build-and-push:
    # 수동 실행도 develop 브랜치에서만 허용한다.
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Verify deployment scripts
        run: |
          bash -n infra/dev/deploy.sh
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s infra/dev/tests -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build (tests + PMD + SpotBugs)
        run: ./gradlew build

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push develop image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/infra/prod/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            DEPLOYED_COMMIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/yeobaek-backend:develop
            ${{ secrets.DOCKERHUB_USERNAME }}/yeobaek-backend:${{ github.sha }}

  measure:
    name: Measure deployment availability
    if: ${{ vars.MONITOR_DEV_ENABLED == 'true' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 33
    env:
      GH_TOKEN: ${{ github.token }}
      MONITOR_ENVIRONMENT: dev
      MONITOR_HEALTH_URL: ${{ vars.MONITOR_DEV_HEALTH_URL }}
      MONITOR_INGEST_URL: ${{ vars.MONITOR_DEV_INGEST_URL }}
      MONITOR_SOURCE_TOKEN: ${{ secrets.MONITOR_DEV_SOURCE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record three pre-deploy health checks
        shell: bash
        run: |
          export MONITOR_READY="$RUNNER_TEMP/deployment-monitor-ready"
          nohup bash -c 'python3 -u backend/infra/monitoring/measure.py; echo "$?" > "$MONITOR_READY.exit"' \
            > "$MONITOR_READY.log" 2>&1 &
          for attempt in {1..60}; do
            if [[ -f "$MONITOR_READY.exit" ]]; then cat "$MONITOR_READY.log"; exit 1; fi
            if [[ -f "$MONITOR_READY" ]]; then exit 0; fi
            sleep 0.5
          done
          echo "Pre-deploy health checks did not complete" >&2
          exit 1
      - name: Collect and send measurement to Better Stack
        shell: bash
        run: |
          MONITOR_READY="$RUNNER_TEMP/deployment-monitor-ready"
          until [[ -s "$MONITOR_READY.exit" ]]; do sleep 1; done
          cat "$MONITOR_READY.log"
          exit "$(cat "$MONITOR_READY.exit")"

  deploy:
    name: Deploy application
    needs: build-and-push
    runs-on: [self-hosted, ec2-dev]
    steps:
      # 빌드한 이미지와 같은 커밋의 배포 스크립트를 실행한다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Wait for pre-deploy health check results
        if: ${{ vars.MONITOR_DEV_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 backend/infra/monitoring/measure.py wait

      # Compose와 환경 파일은 개발 서버에 미리 반영한 것을 사용한다.
      - name: Deploy development server (blue/green)
        id: deploy
        shell: bash
        env:
          DEPLOY_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/yeobaek-backend:${{ github.sha }}
          DEPLOYED_COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          export DEPLOY_DIR="$HOME/yeobaek-dev"
          bash "$GITHUB_WORKSPACE/backend/infra/dev/deploy.sh" "$DEPLOY_IMAGE" "$DEPLOYED_COMMIT_SHA"
