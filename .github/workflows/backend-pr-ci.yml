name: backend-pr-ci

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: backend-pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-pr-verify:
    name: Backend PR verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend changes
        id: backend-changes
        working-directory: .
        run: |
          if git diff --quiet \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}" \
            -- \
            'backend/src/**' \
            'backend/config/**' \
            'backend/build.gradle*' \
            'backend/settings.gradle*' \
            'backend/gradle.properties' \
            'backend/gradle/**' \
            'backend/gradlew' \
            'backend/gradlew.bat' \
            'backend/.gitattributes' \
            'backend/infra/monitoring/**' \
            '.github/workflows/deployment-monitor.yml'; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.backend-changes.outputs.changed == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build (tests + PMD + SpotBugs)
        if: steps.backend-changes.outputs.changed == 'true'
        run: ./gradlew build

      - name: Verify monitoring runner and admin scripts
        if: steps.backend-changes.outputs.changed == 'true'
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s infra/monitoring/tests -v
          node --test src/test/js/*.test.js
