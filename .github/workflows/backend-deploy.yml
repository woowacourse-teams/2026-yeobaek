# 백엔드 CI/CD (M8 배포 구성 결정, 2026-08-06)
# develop에 서버 빌드·실행 관련 변경이 푸시되면: 게이트(테스트+정적분석) → 도커 이미지 빌드 → Docker Hub 푸시(빌드 잡)
# → EC2의 셀프 호스티드 러너에서 pull & 재기동(배포 잡). 보안 그룹이 SSH를 막고 있어
# SSH 대신 EC2에 상주하는 러너(라벨: ec2-prod)가 배포를 수행한다. 시크릿은 backend/docs/배포_가이드.md 참고.
name: backend-deploy

on:
  push:
    branches: [develop]
    paths:
      # 배포 이미지에 반영되는 서버 코드·리소스와 빌드/런타임 설정만 감지한다.
      # 테스트 변경은 배포물에 영향이 없으므로 제외한다 (스펙은 springdoc이 런타임 생성).
      - 'backend/src/main/**'
      - 'backend/build.gradle*'
      - 'backend/settings.gradle*'
      - 'backend/gradle.properties'
      - 'backend/gradle/**'
      - 'backend/gradlew'
      - 'backend/Dockerfile'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

# 연속 푸시 시 배포가 겹치지 않도록 직렬화한다 (진행 중인 배포는 취소하지 않음)
concurrency:
  group: backend-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 커밋 전 게이트와 동일한 검증 (테스트는 Testcontainers로 MySQL 컨테이너 사용)
      - name: Build (tests + PMD + SpotBugs)
        run: ./gradlew build

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # EC2가 Graviton(arm64)이라 멀티아키로 빌드한다. amd64 단일 빌드는 exec format error로 기동 불가.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image (amd64+arm64)
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/yeobaek-backend"
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" --push .

  deploy:
    needs: build
    runs-on: [self-hosted, ec2-prod]
    steps:
      # 서버의 ~/yeobaek/docker-compose.yml과 .env를 사용하므로 체크아웃이 필요 없다
      - name: Pull & restart
        run: |
          cd ~/yeobaek
          docker compose pull
          docker compose up -d
          docker image prune -f
