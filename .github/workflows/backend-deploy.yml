# 백엔드 CI/CD (M8 배포 구성 결정, 2026-08-06)
# develop에 backend 변경이 푸시되면: 게이트(테스트+정적분석) → 도커 이미지 빌드 →
# Docker Hub 푸시 → EC2에서 pull & 재기동. 필요한 시크릿은 docs/배포_가이드.md 참고.
name: backend-deploy

on:
  push:
    branches: [develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 커밋 전 게이트와 동일한 검증 (테스트는 Testcontainers로 MySQL 컨테이너 사용)
      - name: Build (tests + PMD + SpotBugs)
        run: ./gradlew build

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/yeobaek-backend"
          docker build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" .
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Deploy on EC2
        working-directory: .
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > key.pem
          chmod 600 key.pem
          ssh -o StrictHostKeyChecking=accept-new -i key.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'cd ~/yeobaek && docker compose pull && docker compose up -d && docker image prune -f'
