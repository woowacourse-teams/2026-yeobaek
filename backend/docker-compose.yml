services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: yeobaek
      MYSQL_ROOT_PASSWORD: yeobaek
    ports:
      - "127.0.0.1:13306:3306"
    healthcheck:
      # localhost는 초기화용 임시 Unix socket 서버에도 성공하므로 최종 TCP 서버를 확인한다.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pyeobaek"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  app:
    profiles: [api]
    image: ${BACKEND_IMAGE:-BACKEND_IMAGE_NOT_CONFIGURED}
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/yeobaek
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: yeobaek
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
