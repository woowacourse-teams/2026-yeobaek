# 개발 EC2 배포용 구성. 서버의 ~/yeobaek-dev/docker-compose.yml에 필요한 설정을 반영한다.
# 같은 디렉터리의 .env에서 실행 설정을 읽는다. DB·수집기 컨테이너와 볼륨 이름은 유지한다.

# Blue와 Green이 함께 사용하는 앱 설정
x-app-common: &app-common
  image: ${DOCKERHUB_USERNAME}/yeobaek-backend:develop
  restart: unless-stopped
  # Spring의 요청 처리와 자원 정리가 끝나도록 종료 신호 후 최대 90초 기다린다.
  stop_grace_period: 90s
  environment:
    # 운영 DB/S3 설정을 재사용하되 개발 서버 전용 기능은 dev로 활성화한다.
    SPRING_PROFILES_ACTIVE: "prod,dev"
    SPRING_APPLICATION_NAME: yeobaek-api
    OBSERVABILITY_ENABLED: "true"
    OBSERVABILITY_OTLP_ENDPOINT: http://otel-collector:4318
    DEPLOYMENT_ENVIRONMENT: dev
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"
    TZ: Asia/Seoul
    DB_URL: ${YEOBAEK_DATABASE_URL:-jdbc:mysql://mysql:3306/yeobaek}
    DB_USERNAME: root
    DB_PASSWORD: ${DB_PASSWORD}
    ADMIN_TOKEN: ${ADMIN_TOKEN}
    POSTHOG_ENABLED: ${POSTHOG_ENABLED:-false}
    POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
    POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
    BOOK_COVER_S3_BUCKET: ${BOOK_COVER_S3_BUCKET}
    BOOK_COVER_S3_REGION: ${BOOK_COVER_S3_REGION}
    BOOK_COVER_PUBLIC_BASE_URL: ${BOOK_COVER_PUBLIC_BASE_URL}
    BOOK_COVER_S3_PREFIX: ${BOOK_COVER_S3_PREFIX:-yeobaek}
    FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:?FIREBASE_PROJECT_ID is required}
    GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
  volumes:
    - type: bind
      source: ${FIREBASE_CREDENTIALS_FILE:?FIREBASE_CREDENTIALS_FILE must point to the service account JSON}
      target: /run/secrets/firebase-admin.json
      read_only: true
      bind:
        create_host_path: false
  depends_on:
    mysql:
      condition: service_healthy

services:
  # 서비스 이름과 컨테이너 이름 모두 색상을 표시한다.
  app-blue:
    <<: *app-common
    container_name: yeobaek-app-blue
    # nginx가 호스트에서 프록시하므로 로컬호스트에만 바인딩한다.
    ports:
      - "127.0.0.1:8080:8080"

  app-green:
    <<: *app-common
    container_name: yeobaek-app-green
    ports:
      - "127.0.0.1:8081:8080"

  mysql:
    image: mysql:8.4
    container_name: yeobaek-mysql
    # 재시작 후에도 SQL digest의 쿼리별 CPU 시간 계측을 활성화한다.
    command:
      - --performance-schema-consumer-events-statements-cpu=ON
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: yeobaek
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 12

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: yeobaek-otel-collector
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    cpus: "0.5"
    mem_limit: 512m
    env_file:
      - ./otel.env
    volumes:
      - /:/hostfs:ro
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    environment:
      TZ: Asia/Seoul
    command: ["--config=/etc/otelcol-contrib/config.yaml"]

volumes:
  mysql-data:
