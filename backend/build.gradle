plugins {
    id 'java'
    id 'pmd'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.epages.restdocs-api-spec' version '0.20.1'
    id 'com.github.spotbugs' version '6.5.10'
}

group = 'watson'
version = '0.0.1-SNAPSHOT'
description = 'backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    runtimeOnly 'org.webjars:swagger-ui:5.32.11'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.1'
    testImplementation platform('org.testcontainers:testcontainers-bom:1.21.3')
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

pmd {
    toolVersion = '7.26.0'
    ruleSets = []
    ruleSetFiles = files('config/pmd/ruleset.xml')
    consoleOutput = true
}

tasks.named('pmdTest') {
    ruleSetFiles = files('config/pmd/ruleset-test.xml')
}

spotbugs {
    excludeFilter = file('config/spotbugs/exclude.xml')
}

// 배포 잼에 생성된 OpenAPI 스펙을 정적 리소스로 동봉해 Swagger UI(/docs/index.html)가 읽는다
tasks.named('bootJar') {
    dependsOn tasks.named('openapi3')
    from("${layout.buildDirectory.get()}/api-spec") {
        into 'BOOT-INF/classes/static'
    }
}

openapi3 {
    server = 'http://localhost:8080'
    title = '여백 API'
    description = '여백 백엔드 API 문서'
    version = project.version
    format = 'yaml'
}
