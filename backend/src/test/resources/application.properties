spring.jpa.hibernate.ddl-auto=create-drop

# 테스트 리소스의 application.properties가 메인 설정을 가리므로 springdoc 설정을 동일하게 유지한다
springdoc.swagger-ui.path=/docs
springdoc.paths-to-match=/api/**

