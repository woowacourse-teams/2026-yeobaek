spring.jpa.hibernate.ddl-auto=create-drop

# 테스트 리소스가 메인 설정을 가리므로 API 문서 계약 테스트에서 springdoc을 명시적으로 활성화한다.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/docs
springdoc.paths-to-match=/api/**

storage.s3.bucket=yeobaek-test-book-covers
storage.s3.region=ap-northeast-2
storage.s3.public-base-url=https://yeobaek-local-book-covers.s3.ap-northeast-2.amazonaws.com
storage.s3.prefix=yeobaek

spring.config.import=classpath:observability.properties

# 실제 Firebase 인증 없이 SDK 테스트 대역으로 기동한다.
fcm.project-id=yeobaek-test
