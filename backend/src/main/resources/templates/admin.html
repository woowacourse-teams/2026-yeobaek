<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>여백 관리자</title>
    <link rel="stylesheet" href="/admin-dashboard.css">
    <link rel="stylesheet" href="/admin-home.css">
</head>
<body>
<main class="admin-home">
    <header class="page-header">
        <div><p class="eyebrow">여백 / 관리자</p><h1>무엇을 관리할까요?</h1><p>사용할 메뉴를 선택해 주세요.</p></div>
    </header>
    <nav class="admin-menu" aria-label="관리자 메뉴">
        <a class="menu-card" href="/admin/books">
            <span class="eyebrow">01 / 도서</span>
            <h2>도서 관리</h2>
            <p>도서를 등록하고, 표지와 소개를 수정하고, 업로드 현황을 확인합니다.</p>
            <span class="menu-action">도서 관리로 이동 <span aria-hidden="true">↗</span></span>
        </a>
        <a class="menu-card" href="/admin/dashboard">
            <span class="eyebrow">02 / 통계</span>
            <h2>통계</h2>
            <p>모임과 도서, 회원의 참여 현황을 한눈에 확인합니다.</p>
            <span class="menu-action">통계로 이동 <span aria-hidden="true">↗</span></span>
        </a>
        <a class="menu-card" href="/admin/deployment-monitoring">
            <span class="eyebrow">03 / 배포</span>
            <h2>배포 모니터링</h2>
            <p>배포·롤백 중 서비스 응답을 측정하고, 실패 기록과 결과를 확인합니다.</p>
            <span class="menu-action">배포 모니터링으로 이동 <span aria-hidden="true">↗</span></span>
        </a>
    </nav>
    <p class="scope-note">각 화면에서 관리자 토큰을 입력한 뒤 사용할 수 있습니다.</p>
</main>
</body>
</html>
