spring.application.name=backend

# 기존 문서 진입점(/docs)을 유지: Swagger UI로 리다이렉트한다
springdoc.swagger-ui.path=/docs
# 관리자 페이지(Thymeleaf) 등 API가 아닌 핸들러는 스펙에서 제외한다
springdoc.paths-to-match=/api/**

# 도서 표지 저장소. 운영 프로파일에서는 실제 환경변수 값으로 덮어쓴다.
storage.s3.bucket=${BOOK_COVER_S3_BUCKET:yeobaek-local-book-covers}
storage.s3.region=${BOOK_COVER_S3_REGION:ap-northeast-2}
storage.s3.public-base-url=${BOOK_COVER_PUBLIC_BASE_URL:https://yeobaek-local-book-covers.s3.ap-northeast-2.amazonaws.com}
