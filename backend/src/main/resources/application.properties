spring.application.name=backend
logging.structured.format.console=logstash

# 스키마 변경은 Flyway가 수행하고 Hibernate는 매핑만 검증한다.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
# 기존 DB는 스키마를 확인한 뒤 명시적으로 baseline을 기록한다.
spring.flyway.baseline-on-migrate=false

# API 문서는 외부에 노출하지 않고 local/dev 프로파일에서만 활성화한다.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
# 활성화된 환경에서는 기존 문서 진입점(/docs)을 유지한다.
springdoc.swagger-ui.path=/docs
# 관리자 페이지(Thymeleaf) 등 API가 아닌 핸들러는 스펙에서 제외한다
springdoc.paths-to-match=/api/**

# PostHog Product Analytics. 동의 기반 이벤트가 정의되기 전까지 기본 비활성화한다.
posthog.enabled=${POSTHOG_ENABLED:false}
posthog.api-key=${POSTHOG_API_KEY:}
posthog.host=${POSTHOG_HOST:https://us.i.posthog.com}

# 도서 표지 저장소. 운영 프로파일에서는 실제 환경변수 값으로 덮어쓴다.
storage.s3.bucket=${BOOK_COVER_S3_BUCKET:yeobaek-local-book-covers}
storage.s3.region=${BOOK_COVER_S3_REGION:ap-northeast-2}
storage.s3.public-base-url=${BOOK_COVER_PUBLIC_BASE_URL:https://yeobaek-local-book-covers.s3.ap-northeast-2.amazonaws.com}
storage.s3.prefix=${BOOK_COVER_S3_PREFIX:yeobaek}

spring.config.import=classpath:observability.properties
