# 로컬 개발 프로파일. 실행: --spring.profiles.active=local (docker-compose.yml의 MySQL 필요)
spring.datasource.url=jdbc:mysql://localhost:13306/yeobaek
spring.datasource.username=root
spring.datasource.password=yeobaek
# M1 결정(Q2): 데모까지는 ddl-auto로 스키마 관리, 프로토타입부터 DB 직접 관리로 전환
spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:local/data.sql
spring.sql.init.encoding=UTF-8
# 관리자 API 고정 토큰 (로컬 전용 값. 배포 환경은 환경변수 ADMIN_TOKEN으로 주입)
admin.token=local-admin-token
