# 로컬 개발 프로파일. 실행: --spring.profiles.active=local (docker-compose.yml의 MySQL 필요)
spring.datasource.url=jdbc:mysql://localhost:3306/yeobaek
spring.datasource.username=root
spring.datasource.password=yeobaek
# M1 결정(Q2): 데모까지는 ddl-auto로 스키마 관리, 프로토타입부터 DB 직접 관리로 전환
spring.jpa.hibernate.ddl-auto=create
# 로컬에서 Swagger UI가 읽을 OpenAPI 스펙 서빙 (사전 생성 필요: gradlew openapi3)
spring.web.resources.static-locations=classpath:/static/,file:build/api-spec/
# 관리자 API 고정 토큰 (로컬 전용 값. 배포 환경은 환경변수 ADMIN_TOKEN으로 주입)
admin.token=local-admin-token
