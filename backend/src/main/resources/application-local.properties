# 로컬 개발 프로파일. 실행: --spring.profiles.active=local (infra/local/docker-compose.local.yml의 MySQL 필요)
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
spring.datasource.url=jdbc:mysql://localhost:13306/yeobaek
spring.datasource.username=root
spring.datasource.password=yeobaek
# 로컬 시드는 스키마 생성 후 한 번만 적용한다.
spring.flyway.locations=classpath:db/migration,classpath:db/local
# 관리자 API 고정 토큰 (로컬 전용 값. 배포 환경은 환경변수 ADMIN_TOKEN으로 주입)
admin.token=local-admin-token
logging.level.root=DEBUG
