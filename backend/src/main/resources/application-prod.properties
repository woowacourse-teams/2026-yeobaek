# 운영 프로파일 (M8 배포 구성 결정, 2026-08-06 — docs/배포_가이드.md 참고)
# 비밀값은 전부 환경변수 주입 (docker-compose.prod.yml이 .env에서 전달)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# M8 결정: 데모까지 update. 데이터 안전성이 중요해지는 시점에 none + 수동 DDL 전환 재논의
spring.jpa.hibernate.ddl-auto=update
# 관리자 토큰. 미설정이어도 기동은 정상, 관리자 API만 전부 401 (M7 결정)
admin.token=${ADMIN_TOKEN:}
