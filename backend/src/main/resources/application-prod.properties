# 운영 프로파일 (M8 배포 구성 결정, 2026-08-06 — docs/배포_가이드.md 참고)
# 비밀값은 전부 환경변수 주입 (docker-compose.prod.yml이 .env에서 전달)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# 버전 관리된 M1 스키마 이관이 끝난 뒤 애플리케이션은 매핑 일치만 검증한다.
spring.jpa.hibernate.ddl-auto=validate
# 관리자 토큰. 미설정이어도 기동은 정상, 관리자 API만 전부 401 (M7 결정)
admin.token=${ADMIN_TOKEN:}

# 도서 표지 S3 (EC2 인스턴스 프로파일의 기본 자격 증명 체인을 사용한다)
storage.s3.bucket=${BOOK_COVER_S3_BUCKET}
storage.s3.region=${BOOK_COVER_S3_REGION}
storage.s3.public-base-url=${BOOK_COVER_PUBLIC_BASE_URL}
storage.s3.prefix=${BOOK_COVER_S3_PREFIX:yeobaek}
