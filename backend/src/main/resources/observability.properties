# Collector를 사용하는 환경만 외부 전송을 켠다. prod 프로필과 독립적이다.
management.logging.export.otlp.enabled=${OBSERVABILITY_ENABLED:false}
management.tracing.export.otlp.enabled=${OBSERVABILITY_ENABLED:false}
management.otlp.metrics.export.enabled=${OBSERVABILITY_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OBSERVABILITY_OTLP_ENDPOINT:http://localhost:4318}/v1/logs
management.opentelemetry.tracing.export.otlp.endpoint=${OBSERVABILITY_OTLP_ENDPOINT:http://localhost:4318}/v1/traces
management.otlp.metrics.export.url=${OBSERVABILITY_OTLP_ENDPOINT:http://localhost:4318}/v1/metrics
management.opentelemetry.logging.export.otlp.transport=http
management.opentelemetry.tracing.export.otlp.transport=http
management.opentelemetry.resource-attributes[deployment.environment.name]=${DEPLOYMENT_ENVIRONMENT:local}
# 별도 포트의 loopback에서만 노출한다. Docker 호스트에는 publish하지 않는다.
management.server.port=8081
management.server.address=127.0.0.1
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=never
# Tomcat 워커 풀의 busy/current/config.max 메트릭을 수집한다.
server.tomcat.mbeanregistry.enabled=true
# SQL 실행만 관측한다. 풀 획득 시간은 Hikari 고유 메트릭으로 구분한다.
jdbc.includes=QUERY
